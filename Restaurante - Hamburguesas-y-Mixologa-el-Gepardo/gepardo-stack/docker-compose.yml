services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: gepardo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-gepardo_restaurant}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - gepardo-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - Server Admin
  server-admin:
    build:
      context: ../server-admin
      dockerfile: ../gepardo-stack/dockerfiles/Dockerfile.server-admin
    container_name: gepardo-server-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-3000}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/${MONGO_DATABASE:-gepardo_restaurant}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gepardo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api-docs', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Client Admin
  client-admin:
    build:
      context: ../Client-AdminGepardo
      dockerfile: ../gepardo-stack/dockerfiles/Dockerfile.client-admin
      args:
        VITE_AUTH_URL: ${API_URL:-http://server-admin:3000}
        VITE_ADMIN_URL: ${API_URL:-http://server-admin:3000}
    container_name: gepardo-client-admin
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      server-admin:
        condition: service_healthy
    networks:
      - gepardo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./dockerfiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  gepardo-network:
    driver: bridge
